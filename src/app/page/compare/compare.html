<form class="flex items-center justify-center" #compareForm="ngForm">
  <div class="bg-white dark:bg-gray-800 rounded-lg px-6 py-8 ring shadow-xl ring-gray-900/5 col-span-2">
    <div class="flex justify-center">
      <img src="compare.png" class="w-36 p-4 rounded-md border-white" alt="Payroll Lens logo"/>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-2">
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary" placeholder="Company A">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary" placeholder="Company B">
      </div>
    </div>
    <app-collapsible-section title="Compenstion" [formGroup]="compensationForm">

      <div class="grid sm:grid-cols-2 lg:grid-cols-2">
        <app-dropdown label="Currency" [options]="currencyOptions" formControlName="currencyA"></app-dropdown>
        <app-dropdown label="Currency" [options]="currencyOptions" formControlName="currencyB"></app-dropdown>
        <app-dropdown label="Salary Type" [options]="salaryType" formControlName="salaryTypeCompanyA"></app-dropdown>
        <app-dropdown label="Salary Type" [options]="salaryType" formControlName="salaryTypeCompanyB"></app-dropdown>
        <div class="m-2">
          <label for="timeFrame" class="dark:text-green-500 block">Per:</label>
          <select id="incomeType" class="rounded-lg text-green-800 w-full p-1 text-center h-8 bg-white"
                  name="type">
            <option value="Gross" class="rounded-lg">Month</option>
            <option value="Net" class="rounded-lg">Year</option>
            <option value="Net" class="rounded-lg">Hour</option>
          </select>
        </div>
        <div class="m-2">
          <label for="timeFrame" class="dark:text-green-500 block">Per:</label>
          <select id="incomeType" class="rounded-lg text-green-800 w-full p-1 text-center h-8 bg-white"
                  name="type">
            <option value="Gross" class="rounded-lg">Month</option>
            <option value="Net" class="rounded-lg">Year</option>
            <option value="Hour" class="rounded-lg">Hour</option>
          </select>
        </div>
        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Salary:</label>
          <input type="text" id="salary"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white h-8"
                 name="salary">
        </div>
        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Salary:</label>
          <input type="text" id="salary"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white h-8"
                 name="salary">
        </div>
        <div class="m-2">
          <label for="timeFrame" class="dark:text-green-500 block">Currency:</label>
          <select id="incomeType" class="rounded-lg text-green-800 w-full p-1 text-center h-8 bg-white"
                  name="type">
            <option value="EUR" class="rounded-lg">EUR (€)</option>
            <option value="USD" class="rounded-lg">USD ($)</option>
            <option value="RON" class="rounded-lg">RON (RON)</option>
          </select>
        </div>
        <div class="m-2">
          <label for="timeFrame" class="dark:text-green-500 block">Currency:</label>
          <select id="incomeType" class="rounded-lg text-green-800 w-full p-1 text-center h-8 bg-white"
                  name="type">
            <option value="EUR" class="rounded-lg">EUR (€)</option>
            <option value="USD" class="rounded-lg">USD ($)</option>
            <option value="RON" class="rounded-lg">RON (RON)</option>
          </select>
        </div>
      </div>
    </app-collapsible-section>
    <div class="grid sm:grid-cols-2 lg:grid-cols-2">
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary" placeholder="Company A">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary" placeholder="Company B">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <select type="text" id="salary"
                class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                name="">
          <option>Monthly</option>
          <option>Yearly</option>
        </select>
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <select type="text" id="salary"
                class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                name="">
          <option>Monthly</option>
          <option>Yearly</option>
        </select>
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Salary:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Salary:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Meal ticket value:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Meal ticket value:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">RSU(restricted stock units):</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">RSU(restricted stock units):</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Vesting period:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>

      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Vesting period:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Bonuses (per year):</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Bonuses (per year):</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary">
      </div>
    </div>
  </div>
</form>
