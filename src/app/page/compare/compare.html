<form class="flex items-center justify-center" [formGroup]="offer">
  <div
    class="bg-white dark:bg-gray-800 rounded-lg px-6 py-8 ring shadow-xl ring-gray-900/5 col-span-2 min-w-2xl max-w-2xl">
    <div class="flex justify-center">
      <img src="compare.png" class="w-36 p-4 rounded-md border-white" alt="Payroll Lens logo"/>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-2">
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary" placeholder="Company A">
      </div>
      <div class="m-2">
        <label for="salary" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="salary"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               name="salary" placeholder="Company B">
      </div>
    </div>
    <app-collapsible-section title="Compenstion" formGroupName="compensationForm">
      <div class="grid sm:grid-cols-4 lg:grid-cols-4">
        <app-dropdown label="Currency" [options]="currencyOptions" formControlName="currencyA"></app-dropdown>

        <app-dropdown label="Salary type" [options]="salaryTypeOptions"
                      formControlName="salaryTypeCompanyA"></app-dropdown>
        <app-dropdown label="Currency" [options]="currencyOptions" formControlName="currencyB"></app-dropdown>
        <app-dropdown label="Salary type" [options]="salaryTypeOptions"
                      formControlName="salaryTypeCompanyB"></app-dropdown>
        <app-dropdown label="Salary period" [options]="salaryPeriodOptions"
                      formControlName="salaryPeriodA"></app-dropdown>
        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Salary:</label>
          <input type="text" id="salary" formControlName="salaryA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white h-8"
                 name="salary">
        </div>
        <app-dropdown label="Salary period" [options]="salaryPeriodOptions"
                      formControlName="salaryPeriodB"></app-dropdown>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Salary:</label>
          <input type="text" id="salary" formControlName="salaryB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white h-8"
                 name="salary">
        </div>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Meal ticket value:</label>
          <input type="text" id="salary" formControlName="mealTicketA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">RSU(stocks):</label>
          <input type="text" id="salary" formControlName="rsuA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Meal ticket value:</label>
          <input type="text" id="salary" formControlName="mealTicketB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">RSU(stocks):</label>
          <input type="text" id="salary" formControlName="rsuB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>
        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Vesting period:</label>
          <input type="text" id="salary" formControlName="vestingPeriodA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>
        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">NASDAQ ticker:</label>
          <input type="text" id="salary" formControlName="nasdaqTickerA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>


        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Vesting period:</label>
          <input type="text" id="salary" formControlName="vestingPeriodB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>
        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">NASDAQ ticker:</label>
          <input type="text" id="salary" formControlName="nasdaqTickerB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Bonuses (per year):</label>
          <input type="text" id="salary" formControlName="bonusesA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>
        <div class="m-2"></div>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Bonuses (per year):</label>
          <input type="text" id="salary" formControlName="bonusesB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>

      </div>
    </app-collapsible-section>
    <app-collapsible-section title="Benefits" formGroupName="benefitsForm">
      <div class="grid grid-cols-4">
        <app-switch class="m-2" label="Health insurance:" formControlName="healthInsuranceA" (change)="print()"/>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Paid time off(PTO):</label>
          <input type="text" id="salary" formControlName="ptoDaysA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>

        <app-switch class="m-2" label="Health insurance:" formControlName="healthInsuranceB" (change)="print()"/>

        <div class="m-2">
          <label for="salary" class="dark:text-green-500 block">Paid time off(PTO):</label>
          <input type="number" id="salary" formControlName="ptoDaysB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
        </div>

        <app-switch class="m-2" label="Floating Days:" formControlName="floatingDaysA"></app-switch>

        <div class="m-2">
          <label for="wellnessA" class="dark:text-green-500 block">Wellness benefit:</label>
          <input type="number" id="wellnessA" formControlName="wellnessBenefitA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
        </div>

        <app-switch class="m-2" label="Floating days:" formControlName="floatingDaysB"></app-switch>

        <div class="m-2">
          <label for="wellnessB" class="dark:text-green-500 block">Wellness benefit:</label>
          <input type="text" id="wellnessB" formControlName="wellnessBenefitB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
        </div>
      </div>
    </app-collapsible-section>
    <app-collapsible-section title="Work Arrangement" formGroupName="workArrangementForm">
      <div class="grid grid-cols-4">
        <app-dropdown label="Mode" [options]="workLocations" formControlName="locationA"
                      (selected)="workLocationChange($event, 'locationA')"></app-dropdown>
        <div class="m-2">
          <label for="commuteTimeA" class="dark:text-green-500 block">Commute (mins):</label>
          <input type="number" #commA id="commuteTimeA" formControlName="commuteTimeA"
                 [ngClass]="{'disabled-input': commA.disabled}"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
        </div>
        <app-dropdown label="Mode" [options]="workLocations" formControlName="locationB"
                      (selected)="workLocationChange($event, 'locationB')"></app-dropdown>
        <div class="m-2">
          <label for="commuteTimeB" class="dark:text-green-500 block">Commute (mins):</label>
          <input type="number" #commB id="commuteTimeB" formControlName="commuteTimeB"
                 [ngClass]="{'disabled-input': commB.disabled}"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
        </div>
        <app-switch label="Overtime Expectation" formControlName="overtimeExpectationsA"></app-switch>
        <app-switch label="Work Hours Flexibility" formControlName="workHoursFlexibilityA"></app-switch>
        <app-switch label="Overtime Expectation" formControlName="overtimeExpectationsB"></app-switch>
        <app-switch label="Work Hours Flexibility" formControlName="workHoursFlexibilityB"></app-switch>
      </div>
    </app-collapsible-section>

  </div>

</form>
