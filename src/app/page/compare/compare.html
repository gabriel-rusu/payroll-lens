<form class="flex items-center justify-center" [formGroup]="offer">
  <div
    class="bg-white dark:bg-gray-800 rounded-lg px-6 py-6 ring shadow-xl ring-gray-900/5 col-span-2 max-md:min-w-full md:min-w-2xl md:max-w-2xl">
    <div class="flex justify-center">
      <img src="compare.png" class="w-36 p-4 rounded-md border-white" alt="Payroll Lens logo"/>
    </div>

    <div class="grid grid-cols-2" formGroupName="companyNames">
      <div class="m-2">
        <label for="companyNameA" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="companyNameA"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               formControlName="companyNameA" placeholder="Company A">
      </div>
      <div class="m-2">
        <label for="companyNameB" class="dark:text-green-500 block">Company name:</label>
        <input type="text" id="companyNameB"
               class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
               formControlName="companyNameB" placeholder="Company B">
      </div>
    </div>
    <app-collapsible-section title="Compenstion" formGroupName="compensationForm">
      <div class="grid grid-cols-2 ">
        <div class="grid grid-cols-1 md:grid-cols-2">
          <app-dropdown label="Currency" [options]="currencyOptions" formControlName="currencyA"></app-dropdown>

          <app-dropdown label="Salary type" [options]="salaryTypeOptions"
                        formControlName="salaryTypeCompanyA"></app-dropdown>

          <app-dropdown label="Salary period" [options]="salaryPeriodOptions"
                        formControlName="salaryPeriodA"></app-dropdown>
          <div class="m-2">
            <label for="salaryA" class="dark:text-green-500 block">Salary:</label>
            <input type="text" id="salaryA" formControlName="salaryA"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white h-8"
                   name="salary">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <app-dropdown label="Currency" [options]="currencyOptions" formControlName="currencyB"></app-dropdown>
          <app-dropdown label="Salary type" [options]="salaryTypeOptions"
                        formControlName="salaryTypeCompanyB"></app-dropdown>


          <app-dropdown label="Salary period" [options]="salaryPeriodOptions"
                        formControlName="salaryPeriodB"></app-dropdown>
          <div class="m-2">
            <label for="salaryB" class="dark:text-green-500 block">Salary:</label>
            <input type="text" id="salary" formControlName="salaryB"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white h-8"
                   name="salary">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <div class="m-2">
            <label for="mealTicketA" class="dark:text-green-500 block">Meal ticket value:</label>
            <input type="text" id="mealTicketA" formControlName="mealTicketA"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <div class="m-2">
            <label for="rsuA" class="dark:text-green-500 block">RSU(stocks):</label>
            <input type="text" id="rsuA" formControlName="rsuA"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <div class="m-2">
            <label for="vestingPeriodA" class="dark:text-green-500 block">Vesting period:</label>
            <input type="text" id="vestingPeriodA" formControlName="vestingPeriodA"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <div class="m-2">
            <label for="salary" class="dark:text-green-500 block">NASDAQ ticker:</label>
            <input type="text" id="tickerA" #tickerA formControlName="nasdaqTickerA" [ngClass]="{'disabled-input': tickerA.disabled}"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <div class="m-2">
            <label for="mealTicketB" class="dark:text-green-500 block">Meal ticket value:</label>
            <input type="text" id="mealTicketB" formControlName="mealTicketB"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <div class="m-2">
            <label for="rsuB" class="dark:text-green-500 block">RSU(stocks):</label>
            <input type="text" id="rsuB" formControlName="rsuB"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <div class="m-2">
            <label for="vestingPeriodB" class="dark:text-green-500 block">Vesting period:</label>
            <input type="text" id="vestingPeriodB" formControlName="vestingPeriodB"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <div class="m-2">
            <label for="tickerB" class="dark:text-green-500 block">NASDAQ ticker:</label>
            <input type="text" id="tickerB" #tickerB formControlName="nasdaqTickerB" [ngClass]="{'disabled-input': tickerB.disabled}"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
        <div class="m-2">
          <label for="bonusesA" class="dark:text-green-500 block">Bonuses (per year):</label>
          <input type="text" id="bonusesA" formControlName="bonusesA"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>
          <div class="m-2">
            <label for="sharePriceA" class="dark:text-green-500 block">Price per share:</label>
            <input type="text" id="sharePriceA" #sharePriceA formControlName="pricePerShareCompanyA" [ngClass]="{'disabled-input' : sharePriceA.disabled}"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
        <div class="m-2">
          <label for="bonusesB" class="dark:text-green-500 block">Bonuses (per year):</label>
          <input type="text" id="bonusesB" formControlName="bonusesB"
                 class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                 name="salary">
        </div>
          <div class="m-2">
            <label for="sharePriceB" class="dark:text-green-500 block">Price per share:</label>
            <input type="text" id="salary" #sharePriceB formControlName="pricePerShareCompanyB" [ngClass]="{'disabled-input' : sharePriceB.disabled}"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
        </div>

      </div>
    </app-collapsible-section>
    <app-collapsible-section title="Benefits" formGroupName="benefitsForm">
      <div class="grid grid-cols-2">
        <div class="grid grid-cols-1 md:grid-cols-2">

          <div class="m-2">
            <label for="wellnessA" class="dark:text-green-500 block">Wellness benefit:</label>
            <input type="number" id="wellnessA" formControlName="wellnessBenefitA"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
          </div>
          <div class="m-2">
            <label for="ptoA" class="dark:text-green-500 block">Paid time off(PTO):</label>
            <input type="text" id="ptoA" formControlName="ptoDaysA"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white"
                   name="salary">
          </div>
          <app-switch label="Floating Days:" formControlName="floatingDaysA"></app-switch>
          <app-switch label="Health insurance:" formControlName="healthInsuranceA" />
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <div class="m-2">
            <label for="wellnessB" class="dark:text-green-500 block">Wellness benefit:</label>
            <input type="text" id="wellnessB" formControlName="wellnessBenefitB"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
          </div>
          <div class="m-2">
            <label for="ptoB" class="dark:text-green-500 block">Paid time off(PTO):</label>
            <input type="number" id="ptoB" formControlName="ptoDaysB"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
          </div>
          <app-switch label="Floating days:" formControlName="floatingDaysB"></app-switch>
          <app-switch label="Health insurance:" formControlName="healthInsuranceB"/>

        </div>
      </div>
    </app-collapsible-section>
    <app-collapsible-section title="Work Arrangement" formGroupName="workArrangementForm">
      <div class="grid grid-cols-2">
        <div class="grid grid-cols-1 md:grid-cols-2">
          <app-dropdown label="Mode" [options]="workLocations" formControlName="locationA"
                        (selected)="workLocationChange($event, 'locationA')"></app-dropdown>
          <div class="m-2">
            <label for="commuteTimeA" class="dark:text-green-500 block">Commute (mins):</label>
            <input type="number" #commA id="commuteTimeA" formControlName="commuteTimeA"
                   [ngClass]="{'disabled-input': commA.disabled}"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
          </div>
          <app-switch label="Overtime Expectation" formControlName="overtimeExpectationsA"></app-switch>
          <app-switch label="Work Hours Flexibility" formControlName="workHoursFlexibilityA"></app-switch>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <app-dropdown label="Mode" [options]="workLocations" formControlName="locationB"
                        (selected)="workLocationChange($event, 'locationB')"></app-dropdown>
          <div class="m-2">
            <label for="commuteTimeB" class="dark:text-green-500 block">Commute (mins):</label>
            <input type="number" #commB id="commuteTimeB" formControlName="commuteTimeB"
                   [ngClass]="{'disabled-input': commB.disabled}"
                   class="p-1 rounded-lg text-center w-full text-green-800 bg-white">
          </div>

          <app-switch label="Overtime Expectation" formControlName="overtimeExpectationsB"></app-switch>
          <app-switch label="Work Hours Flexibility" formControlName="workHoursFlexibilityB"></app-switch>
        </div>
      </div>
    </app-collapsible-section>
    <app-collapsible-section title="Career Growth" formGroupName="careerGrowth">
      <div class="grid grid-cols-2">
        <div class="grid grid-cols-1 md:grid-cols-2">
          <app-switch label="Promotion path" formControlName="promotionPathA"/>
          <app-switch label="Training" formControlName="trainingOpportunityA"/>
          <app-switch label="Mentorship" formControlName="mentorshipA"></app-switch>
          <app-switch label="Stability" formControlName="companyStabilityA"></app-switch>

        </div>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <app-switch label="Promotion path" formControlName="promotionPathB"/>
          <app-switch label="Training" formControlName="trainingOpportunityB"/>
          <app-switch label="Mentorship" formControlName="mentorshipB"></app-switch>
          <app-switch label="Stability" formControlName="companyStabilityB"></app-switch>
        </div>
      </div>
    </app-collapsible-section>
    <div class="text-center mt-4">
      <button class="bg-green-800 p-2 rounded-lg mx-2  text-right dark:text-gray-200 cursor-pointer" (click)="compareOffers()">Compare</button>
    </div>
  </div>


</form>
