<form class="flex items-center justify-center" #salaryForm="ngForm">
  <div class="bg-white dark:bg-gray-800 rounded-lg sm:px-4 py-4 ring shadow-xl m-auto ring-gray-900/5
       max-sm:w-full sm:w-[640px]">
    <div class="flex justify-center">
      <img src="beach-chair.png" class="not-sm:w-24 sm:w-32 p-4 rounded-md border-white"
           alt="An image with a beach chair and an umbrella"/>
    </div>
    <div class="grid sm:grid-cols lg:grid-cols text-white">
      <full-calendar [options]="calendarOptions" [events]="legalHolidays"></full-calendar>
    </div>
    @if (isActive) {
      <div class="grid grid-cols-3">
        <div class="col-span-2">
          <app-dropdown [options]="workWeekDays" label="Compensatory free day"></app-dropdown>
        </div>
        <div class="grid-cols-1">
          <button type="button" class="btn-primary mt-8">Update <span class="hidden sm:inline">Suggestions</span></button>
        </div>
      </div>
    }
  </div>
</form>
