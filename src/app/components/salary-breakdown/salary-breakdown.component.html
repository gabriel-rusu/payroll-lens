<div class="flex justify-center">
  <div class="lg:w-[50vw] sm:w-[80vw]  bg-white dark:bg-gray-800 rounded-lg p-5 ">
    <div>
      <h1 class="font-extrabold size-4 text-gray-400 w-auto">Tax breakdown</h1>
    </div>
    <table class="w-full table-auto  text-sm  rounded-lg">
      <thead>
      <tr>
        <th
          class="border-b border-gray-200 p-4 pt-3 pb-3 pl-8 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-200">
          Tax name
        </th>
        <th
          class="border-b border-gray-200 p-4 pt-3 pb-3 pl-8 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-200">
          Percentage (%)
        </th>
        <th
          class="border-b border-gray-200 p-4 pt-3 pb-3 pl-8 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-200">
          Value ({{ currency() }})
        </th>
      </tr>
      </thead>
      <tbody class="bg-white dark:bg-gray-800">
        @for (tax of taxes; track tax.name) {
          <tr>
            <td
              class="border-b border-gray-100 p-4 pl-8 text-gray-500 dark:border-gray-700 dark:text-gray-400">{{ tax.name + " (" + tax.symbol + ")" }}
            </td>
            <td
              class="border-b border-gray-100 p-4 pl-8 text-gray-500 dark:border-gray-700 dark:text-gray-400">{{ tax.quota + "%" }}
            </td>
            <td
              class="border-b border-gray-100 p-4 pl-8 text-gray-500 dark:border-gray-700 dark:text-gray-400">{{ tax.value }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
