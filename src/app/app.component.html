<div class="flex items-center justify-center h-[75vh]">


  <div class="bg-white dark:bg-gray-800 rounded-lg px-6 py-8 ring shadow-xl ring-gray-900/5 col-span-2">
    <div class="flex justify-center">
      <img src="salary.png" class="w-36 p-4 rounded-md border-white"/>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3">

      <div class="m-2">
        <label for="incomeType" class="dark:text-blue-500 block">Salary Type:</label>
        <select name="period" id="incomeType" class="rounded-lg text-blue-500 w-full p-1">
          <option value="Gross" class="rounded-lg">Gross</option>
          <option value="Net" class="rounded-lg">Net</option>
        </select>
      </div>
      <div class="m-2">
        <label for="tax" class="dark:text-blue-500 block">Tax rate:</label>
        <input type="text" id="tax" class="p-1 rounded-lg text-center w-full">
      </div>

      <div class="m-2">
        <label for="hours" class="dark:text-blue-500 block">Hours per week:</label>
        <input type="text" id="hours" class="p-1 rounded-lg text-center w-full" [defaultValue]="40">
      </div>

      <div class="m-2">
        <label for="days" class="dark:text-blue-500 block">Days per week:</label>
        <input type="text" id="days" class="p-1 rounded-lg text-center w-full" [defaultValue]="5">
      </div>

      <div class="m-2">
        <label for="holidays" class="dark:text-blue-500 block">Holidays per year:</label>
        <input type="text" id="hours" class="p-1 rounded-lg text-center w-full" [defaultValue]="10">
      </div>

      <div class="m-2">
        <label for="hours" class="dark:text-blue-500 block">Vacation days per year:</label>
        <input type="text" id="hours" class="p-1 rounded-lg text-center w-full" [defaultValue]="21">
      </div>

      <div class="m-2">
        <label for="salary" class="dark:text-blue-500 block">Salary:</label>
        <input type="text" id="salary" class="p-1 rounded-lg text-center w-full">
      </div>

      <div class="m-2">
        <label class="dark:text-blue-500 block" for="period">Per:</label>
        <select name="period" id="period" class="rounded-lg text-blue-500 w-full p-1">
          <option value="Monthly" class="rounded-lg">Month</option>
          <option value="Yearly" class="rounded-lg">Year</option>
          <option value="Daily" class="rounded-lg">Day</option>
          <option value="Weekly" class="rounded-lg">Week</option>
        </select>
      </div>

      <div class="m-2">
        <label class="dark:text-blue-500 block" for="currency">Currency:</label>
        <select name="currency" id="currency" class="rounded-lg text-blue-500 w-full p-1">
          <option value="euro" class="rounded-lg">Euro</option>
          <option value="usd" class="rounded-lg">US Dollar</option>
          <option value="ron" class="rounded-lg">RON</option>
        </select>
      </div>
    </div>
    <div class="text-right">
<!--      <button class="bg-blue-600 p-1 rounded-lg mx-2 text-right"></button>-->
      <button class="bg-blue-600 p-1 rounded-lg mx-2 text-right">Calculate</button>
    </div>
  </div>

</div>
