<!-- SideNavBar (The Anchor) -->
<aside class="max-md:hidden h-screen w-64 fixed left-0 top-0 flex flex-col bg-slate-100 dark:bg-slate-950 font-inter text-sm font-medium z-50">
  <div class="py-8 flex flex-col gap-y-2 h-full">
    <div class="px-8 mb-8">
      <h1 class="text-xl font-bold text-slate-900 dark:text-white mb-1 tracking-tight">
        <img src="pay-day.png" width="32" style="display: inline">
        Payroll Lens</h1>
      <p class="text-[10px] uppercase tracking-widest text-on-surface-variant/60 font-bold">Financial Architect</p>
    </div>
    <nav class="flex-grow">
      <a class="flex items-center gap-3 py-3 text-slate-500 dark:text-slate-400 pl-8 hover:text-slate-900 dark:hover:text-white hover:translate-x-1 transition-all duration-200" [routerLink]="['/salary-calculator']" routerLinkActive="text-slate-900">
        <span class="material-symbols-outlined">calculate</span>
        <span>Salary Calculator</span>
      </a>
      <a class="flex items-center gap-3 py-3 text-slate-500 dark:text-slate-400 pl-8 hover:text-slate-900 dark:hover:text-white hover:translate-x-1 transition-all duration-200" [routerLink]="['/vacation-planner']" routerLinkActive="text-slate-900">
        <span class="material-symbols-outlined">event_available</span>
        <span>Vacation Planner</span>
      </a>
      <a class="flex items-center gap-3 py-3 text-slate-500 dark:text-slate-400 pl-8 hover:text-slate-900 dark:hover:text-white hover:translate-x-1 transition-all duration-200" [routerLink]="['/offer-comparison']" routerLinkActive="text-slate-900">
        <span class="material-symbols-outlined">compare_arrows</span>
        <span>Offer Comparison</span>
      </a>
    </nav>
  </div>
</aside>
