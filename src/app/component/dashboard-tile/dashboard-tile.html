<div
  class="bg-white dark:bg-gray-800 rounded-lg px-6 py-8 ring shadow-xl ring-gray-900/5 w-64 h-64 inline-block m-3 cursor-pointer"
  routerLink="{{redirect()}}">
  <div class="flex justify-center">
    <img ngSrc="{{image().src}}" class="p-4 rounded-md border-white" [width]="image().width" [height]="image().height" alt="{{name()}} logo image"/>
  </div>
  <div class="flex justify-center text-white">
    <p>{{ name() }}</p>
  </div>
</div>
