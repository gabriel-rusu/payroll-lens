<form [formGroup]="form">
  <div class="space-y-8 bg-surface-container-low p-8 rounded-xl">
    <div class="flex items-center justify-between mb-4">
            <span
              class="text-xs font-black uppercase tracking-widest text-on-surface-variant opacity-50">Offer Profile</span>
      <span class="px-3 py-1 bg-primary text-on-primary text-[10px] font-bold rounded-full">{{ offerLabel() }}</span>
    </div>
    <div class="space-y-6">
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Job
          Title</label>
        <input formControlName="jobTitle"
               class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
               placeholder="e.g. Senior Financial Analyst" type="text" />
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Company
          Name</label>
        <input formControlName="companyName"
               class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
               placeholder="e.g. Goldman Sachs" type="text" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Salary
            Currency</label>
          <select formControlName="salaryCurrency" #sCurrency
                  class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-on-surface font-semibold appearance-none">
            @for (currency of supportedCurrencies(); track currency) {
              <option>{{ currency }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Salary
            Frequency</label>
          <select formControlName="frequency"
                  class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-on-surface font-semibold appearance-none">
            @for (frequency of supportedFrequencies(); track frequency) {
              <option>{{ frequency }}</option>
            }
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Base
            Salary</label>
          <div class="relative">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/4 text-on-surface-variant font-bold">{{ sCurrency.value == 'EURO' ? '€' : sCurrency.value == 'RON' ? 'RON' : '$' }}</span>
            <input formControlName="baseSalary" formattedNumber
                   class="w-full bg-surface-container-highest border-none rounded-lg p-4 pl-8 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
                   [class.pl-14]="sCurrency.value == 'RON'"
                   placeholder="120,000" type="text" />
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Annual
            Bonus %</label>
          <div class="relative">
            <span class="absolute right-4 top-1/2 -translate-y-1/4 text-on-surface-variant font-bold">%</span>
            <input formControlName="annualBonusPercentage"
                   class="w-full bg-surface-container-highest border-none rounded-lg p-4 pr-8 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
                   placeholder="15" type="number" />
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Equity
            Currency</label>
          <select formControlName="equityCurrency" #eCurrency
                  class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-on-surface font-semibold appearance-none">
            @for (currency of supportedCurrencies(); track currency) {
              <option>{{ currency }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Vesting
            Period (years)</label>
          <div>
            <input formControlName="vestingPeriod"
                   class="w-full bg-surface-container-highest border-none rounded-lg p-4 pr-8 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
                   placeholder="4" type="number" />
          </div>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Equity
          / RSUs (Total Value)</label>
        <div class="relative">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/4 text-on-surface-variant font-bold">{{ eCurrency.value == 'EURO' ? '€' : eCurrency.value == 'RON' ? 'RON' : '$' }}</span>
          <input formControlName="equity" formattedNumber [class.pl-14]="eCurrency.value == 'RON'"
                 class="w-full bg-surface-container-highest border-none rounded-lg p-4 pl-8 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
                 placeholder="50,000" type="text" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Vacation
            Days</label>
          <input formControlName="vacationDays"
                 class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50 text-on-surface font-semibold"
                 placeholder="20" type="number" />
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Work
            Policy</label>
          <select formControlName="workPolicy"
                  class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-on-surface font-semibold appearance-none">
            @for (policy of supportedWorkPolicy(); track policy) {
              <option>{{ policy }}</option>
            }
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 ml-1">Health
          Benefits</label>
        <select formControlName="healthBenefits"
                class="w-full bg-surface-container-highest border-none rounded-lg p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-on-surface font-semibold appearance-none">
          @for (benefit of supportedHealthBenefits(); track benefit) {
            <option>{{ benefit }}</option>
          }
        </select>
      </div>
      <app-chip-dropdown [options]="allPerks" label="Perks" formControlName="perks"></app-chip-dropdown>
    </div>
  </div>
</form>
