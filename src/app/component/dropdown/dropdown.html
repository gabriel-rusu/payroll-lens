<div class="m-2">
  <label class="dark:text-green-500 block">{{ label() }}:</label>
  <select class="rounded-lg text-green-800 w-full p-1 h-8 text-center bg-white" name="type"
          [ngModel]="value"
          (ngModelChange)="handleChange($event)"
          [disabled]="isDisabled"
          [compareWith]="optionsCompare">
    @for (option of options(); track option) {
      <option [ngValue]="option" class="rounded-lg" [selected]="option.value == 1">{{option.label}}</option>
    }
  </select>
</div>
