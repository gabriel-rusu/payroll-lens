<!--
  Labels and both offers share the parent grid rows via subgrid, so every label stays aligned
  with its values whatever the content height or screen size.
  Mobile: labels + Offer A on rows 1-6, labels + Offer B on rows 7-12. Desktop: all on rows 1-6.
-->
<div class="grid grid-cols-12 gap-x-6 relative">
  <app-comparison-labels class="col-span-3 md:col-span-2 max-md:mb-10" />
  <app-offer-card class="col-span-9 md:col-span-5 max-md:mb-10"
                  [offer]="overview().offerA" label="Option A" />
  <app-comparison-labels class="md:hidden col-span-3" />
  <app-offer-card class="col-span-9 md:col-span-5"
                  [offer]="overview().offerB" label="Option B"
                  labelCss="bg-tertiary-container text-tertiary-fixed" />
</div>
